<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Календарь 2027</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; max-width: 1280px; margin: 24px auto; padding: 0 16px; color: #253047; background: #f6f7fa; }
        p { line-height: 1.5; }
        #calendar { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px; }
        .month { background: white; padding: 14px; border: 1px solid #dce2eb; border-radius: 10px; }
        .month h3 { margin: 0 0 14px; }
        .weekdays, .week { display: flex; gap: 3px; }
        .weekdays div, .day { width: calc((100% - 18px) / 7); flex-shrink: 0; text-align: center; }
        .weekdays div { font-size: 11px; padding-bottom: 8px; color: #627089; }
        .day { height: 42px; padding: 0 0 8px; border-radius: 5px; border: 1px solid #dce2eb; position: relative; font: inherit; background: white; color: inherit; }
        button.day { cursor: pointer; user-select: none; }
        button.day:hover { border-color: #253047; }
        button.day:focus-visible { outline: 3px solid #6b55ce; outline-offset: 1px; }
        .day.shared-weekend { background: #ffd0d9; }
        .day[data-mark="red"] { background: #c72739; color: white; }
        .day[data-mark="blue"] { background: #245bc4; color: white; }
        .day[data-mark="both"] { background: linear-gradient(90deg, #c72739 50%, #245bc4 50%); color: white; }
        .week { margin-bottom: 3px; }
        .indicators { position: absolute; left: 3px; right: 3px; bottom: 3px; display: flex; gap: 3px; }
        .indicator { width: 50%; height: 5px; border: 1px solid white; border-radius: 2px; background: #dce2eb; }
        .indicator.off { background: #dc263c; }
        .indicator.off:last-child { background: #245bc4; }
        #storage-status { font-size: 14px; color: #526078; }
        #storage-status:empty { display: none; }
        .preset-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 24px 0; }
        .preset-controls select, .preset-controls button { font: inherit; padding: 10px 14px; border: 1px solid #dce2eb; border-radius: 6px; background: white; color: inherit; }
    </style>
</head>
<body>
<h1>Календарь 2027</h1>
<p id="storage-status" role="status" aria-live="polite"></p>
<div id="calendar" aria-label="Календарь на 2027 год"></div>

<div class="preset-controls">
<label for="preset-select">Пресет</label>
<select id="preset-select"><option value="">Выберите пресет</option></select>
<button type="button" id="clear-marks">Очистить календарь</button>
</div>
<script>
    const holidays1 = [
        "01-01","01-02","01-03","01-04","01-05","01-06","01-07","01-08",
        "02-22","02-23","03-08","05-01","05-03","05-09","05-10",
        "06-12","06-14","11-04","11-05","12-31"
    ].map(d => '2027-' + d);
    const holidays2 = [
        "01-01","01-02","01-03","01-04","01-05","01-06","01-07",
        "01-27","03-08","03-21","05-01","05-02","05-03","05-04","05-05",
        "05-06","05-07","05-08","05-09","08-31"
    ].map(d => '2027-' + d);
    const storageKey = 'yearplan:marks:2027:v1';
    const status = document.getElementById('storage-status');
    let marks = {};
    function readMarks(raw) {
        const value = JSON.parse(raw || '{}');
        if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('Invalid data');
        return Object.fromEntries(Object.entries(value).filter(([date, color]) => {
            if (!/^2027-\d{2}-\d{2}$/.test(date) || !['red','blue','both'].includes(color)) return false;
            const [year, month, day] = date.split('-').map(Number);
            const d = new Date(year, month - 1, day);
            return d.getFullYear() === year && d.getMonth() === month - 1 && d.getDate() === day;
        }));
    }
    try {
        marks = readMarks(localStorage.getItem(storageKey));
        status.textContent = '';
    } catch {
        status.textContent = 'Не удалось прочитать сохранённые отметки. Проверьте доступ к памяти браузера.';
    }
    const preset = Object.freeze({
        '2027-01-11': 'red',
        '2027-01-12': 'red',
        '2027-01-13': 'red',
        '2027-01-14': 'red',
        '2027-01-15': 'red',
        '2027-03-09': 'red',
        '2027-03-10': 'red',
        '2027-03-11': 'red',
        '2027-03-12': 'red',
        '2027-05-04': 'red',
        '2027-05-05': 'red',
        '2027-05-06': 'red',
        '2027-05-07': 'red',
        '2027-07-12': 'both',
        '2027-07-13': 'both',
        '2027-07-14': 'both',
        '2027-07-15': 'both',
        '2027-07-16': 'both',
        '2027-07-17': 'both',
        '2027-07-18': 'both',
        '2027-07-19': 'both',
        '2027-07-20': 'both',
        '2027-07-21': 'both',
        '2027-07-22': 'both',
        '2027-07-23': 'both',
        '2027-07-24': 'both',
        '2027-07-25': 'both',
        '2027-11-01': 'red',
        '2027-11-02': 'red',
        '2027-11-03': 'red',
        '2027-12-28': 'red',
        '2027-12-29': 'red',
        '2027-12-30': 'red',
    });
    const presetSelect = document.getElementById('preset-select');
    const presetOption = document.createElement('option');
    presetOption.value = 'saved';
    presetOption.textContent = 'Пресет 1';
    presetSelect.appendChild(presetOption);
    function replaceMarks(next) {
        try {
            localStorage.setItem(storageKey, JSON.stringify(next));
            marks = { ...next };
            document.querySelectorAll('[data-date]').forEach(paintMark);
            status.textContent = '';
        } catch {
            status.textContent = 'Не удалось сохранить изменения. Отметки оставлены на месте.';
        }
        presetSelect.value = '';
    }
    presetSelect.addEventListener('change', () => {
        if (presetSelect.value === 'saved' && preset) replaceMarks(preset);
    });
    document.getElementById('clear-marks').addEventListener('click', () => replaceMarks({}));
    function paintMark(cell) {
        cell.dataset.mark = marks[cell.dataset.date] || '';
        cell.setAttribute('aria-pressed', String(Boolean(marks[cell.dataset.date])));
        cell.setAttribute('aria-label', cell.title + (marks[cell.dataset.date] ? '; ' + (marks[cell.dataset.date] === 'both' ? 'красная и синяя отметки' : marks[cell.dataset.date] === 'red' ? 'красная отметка' : 'синяя отметка') : ''));
    }
    function toggleMark(cell, color) {
        const date = cell.dataset.date;
        const current = marks[date];
        if (current === 'both') marks[date] = color === 'red' ? 'blue' : 'red';
        else if (current === color) delete marks[date];
        else if (current) marks[date] = 'both';
        else marks[date] = color;
        paintMark(cell);
        try {
            localStorage.setItem(storageKey, JSON.stringify(marks));
            status.textContent = '';
        } catch {
            status.textContent = 'Не удалось сохранить: память браузера недоступна или заполнена. Отметки останутся только до закрытия страницы.';
        }
    }

    const calendarDiv = document.getElementById('calendar');
    const monthNames = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
    const weekDays = ["ПН","ВТ","СР","ЧТ","ПТ","СБ","ВС"];

    for(let month=0; month<12; month++){
        const monthDiv = document.createElement('div');
        monthDiv.className = 'month';

        const h3 = document.createElement('h3');
        h3.textContent = monthNames[month];
        monthDiv.appendChild(h3);

        // Week header
        const weekdaysDiv = document.createElement('div');
        weekdaysDiv.className = 'weekdays';
        weekDays.forEach(d => {
            const wd = document.createElement('div');
            wd.textContent = d;
            weekdaysDiv.appendChild(wd);
        });
        monthDiv.appendChild(weekdaysDiv);

        const daysInMonth = new Date(2027, month+1, 0).getDate();
        let weekDiv = document.createElement('div');
        weekDiv.className = 'week';

        const firstDay = new Date(2027, month, 1).getDay();
        let offset = firstDay === 0 ? 6 : firstDay - 1;

        weekDiv.style.justifyContent = 'flex-end';

        // Empty cells before 1 week
        for(let i=0;i<offset;i++){
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'day';
            emptyDiv.style.border='1px solid white';
            emptyDiv.style.background='white';
            weekDiv.appendChild(emptyDiv);
        }

        for(let day=1; day<=daysInMonth; day++){
            const dayDiv = document.createElement('button');
            dayDiv.type = 'button';
            dayDiv.className = 'day';
            const dateStr = `2027-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            dayDiv.dataset.date = dateStr;
            dayDiv.textContent = day;

            const weekdayIndex = (offset + day - 1) % 7;
            const weekend = weekdayIndex >= 5;
            const off1 = holidays1.includes(dateStr) || (weekend && dateStr !== '2027-02-20');
            const off2 = holidays2.includes(dateStr) || weekend;
            if (weekend && off1 && off2) dayDiv.classList.add('shared-weekend');
            const info = (off, holiday) => holiday ? 'Праздник / нерабочий день' : off ? 'Выходной' : 'Рабочий день';
            dayDiv.title = `${dateStr}\nКрасный: ${info(off1, holidays1.includes(dateStr))}\nСиний: ${info(off2, holidays2.includes(dateStr))}`;
            const indicators = document.createElement('span');
            indicators.className = 'indicators';
            indicators.setAttribute('aria-hidden', 'true');
            [off1, off2].forEach(off => {
                const bar = document.createElement('span');
                bar.className = 'indicator' + (off ? ' off' : '');
                indicators.appendChild(bar);
            });
            dayDiv.appendChild(indicators);
            paintMark(dayDiv);
            dayDiv.addEventListener('click', e => toggleMark(dayDiv, e.shiftKey ? 'blue' : 'red'));
            dayDiv.addEventListener('contextmenu', e => { e.preventDefault(); toggleMark(dayDiv, 'blue'); });

            weekDiv.appendChild(dayDiv);

            if(weekdayIndex === 6){
                // После первой недели вернуть обычное распределение
                weekDiv.style.justifyContent = 'flex-start';
                monthDiv.appendChild(weekDiv);
                weekDiv = document.createElement('div');
                weekDiv.className = 'week';
            }
        }

        // Заполняем пустышками последнюю неделю
        while(weekDiv.children.length < 7){
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'day';
            emptyDiv.style.border='none';
            emptyDiv.style.background='transparent';
            weekDiv.appendChild(emptyDiv);
        }

        if(weekDiv.querySelector('[data-date]')){
            monthDiv.appendChild(weekDiv);
        }

        calendarDiv.appendChild(monthDiv);
    }
    window.addEventListener('storage', event => {
        if (event.key !== storageKey && event.key !== null) return;
        try {
            marks = readMarks(event.newValue);
            document.querySelectorAll('[data-date]').forEach(paintMark);
            status.textContent = '';
        } catch { status.textContent = 'Не удалось прочитать отметки из другой вкладки.'; }
    });
</script>
</body>
</html>
